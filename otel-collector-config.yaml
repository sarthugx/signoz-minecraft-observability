receivers:
  # Scrapes the Prometheus-format metrics exposed by the
  # sladkoff/minecraft-prometheus-exporter Paper plugin
  prometheus:
    config:
      scrape_configs:
        - job_name: 'minecraft'
          scrape_interval: 10s
          static_configs:
            - targets: ['host.docker.internal:9940']

  # Tails Paper's log file for join/leave/chat/error/crash events
  filelog:
    include:
      - /home/timepass/minecraft servers (s)/signoz-test/logs/latest.log
    start_at: end
    resource:
      service.name: minecraft-server-logs

  # Note: JVM metrics from the OpenTelemetry Java agent (Stage 3) are sent
  # directly to SigNoz's own OTLP endpoint (localhost:4317), not through
  # this collector — no receiver needed here for that.

processors:
  batch: {}
  resource:
    attributes:
      - key: service.name
        value: minecraft-server
        action: upsert

exporters:
  otlp:
    endpoint: host.docker.internal:4317   # SigNoz's OTLP gRPC ingestion endpoint
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [batch, resource]
      exporters: [otlp]
    logs:
      receivers: [filelog]
      processors: [batch, resource]
      exporters: [otlp]
